<html lang="en">
<head>
<meta charset="utf-8">
<title>SboxServerConsole</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Inline so the dashboard stays a single self-contained file with no extra request -->
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjI0OCIgZmlsbD0iIzFENUZEOCIvPjxjaXJjbGUgY3g9IjI1NiIgY3k9IjI1NiIgcj0iMjI4IiBmaWxsPSIjMkE3NUZBIi8+PHBhdGggZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9Ijc0IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGQ9Ik0xMzYgMTUwbDEzMiAxMDYtMTMyIDEwNiIvPjxyZWN0IHg9IjMzOCIgeT0iMTYwIiB3aWR0aD0iODQiIGhlaWdodD0iMTkyIiByeD0iMTIiIGZpbGw9IiNmZmYiLz48L3N2Zz4=">
<style>
  :root { color-scheme: dark; --bg:#1a1a1f; --panel:#22232a; --border:#2c2d36; --fg:#e8e8ec; --mute:#8a8d99; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --ipt:#15161b; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:10px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; background:var(--panel); }
  header .brand { width:20px; height:20px; flex:0 0 20px; display:block; margin-right:-6px; }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  header .pill { font-size:11px; padding:2px 8px; border-radius:99px; background:#0d0e12; border:1px solid var(--border); color:var(--mute); }
  header .ok { color:var(--ok); border-color:var(--ok); }
  header .bad { color:var(--bad); border-color:var(--bad); }
  header .right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  header #auth-msg { color:var(--bad); font-size:12px; }
  header #auth-msg:empty { display:none; }
  input[type=password], input[type=text], input:not([type]) { background:var(--ipt); color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:5px 8px; font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:4px; padding:5px 12px; cursor:pointer; font:inherit; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--border); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  /* Header and command bar keep their height; the console takes the rest, so the
     command bar never falls below the window. */
  main { display:grid; grid-template-columns: 1fr 320px; gap:0; flex:1; min-height:0; }
  #console { background:#0e0f13; padding:8px 12px; overflow-y:auto; font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; }
  #console .ln { white-space:pre-wrap; word-break:break-word; }
  #console .ln.input  { color:#67e8f9; }
  #console .ln.chat { color:#86efac; font-weight:600; }
  #console .ln.system { color:var(--mute); font-style:italic; }
  #console .ln.stderr { color:#fda4af; }
  aside { border-left:1px solid var(--border); background:var(--panel); display:flex; flex-direction:column; overflow:hidden; }
  .tabs { display:flex; border-bottom:1px solid var(--border); }
  .tabs button { flex:1; background:transparent; color:var(--mute); border-radius:0; padding:9px 0; border-right:1px solid var(--border); }
  .tabs button:last-child { border-right:0; }
  .tabs button.active { color:var(--fg); background:var(--bg); }
  .panel { flex:1; overflow-y:auto; padding:10px 12px; display:none; }
  .panel.active { display:block; }
  .row { display:flex; gap:6px; padding:5px 0; border-bottom:1px solid var(--border); align-items:center; }
  .row .name { flex:1; }
  .row .meta { color:var(--mute); font-size:11px; }
  .row button { padding:3px 8px; font-size:11px; }
  .row button.del { background:var(--bad); }
  form.add { display:grid; grid-template-columns:1fr; gap:5px; padding-top:8px; }
  form.add input { font-size:12px; }
  .empty { color:var(--mute); padding:14px 0; text-align:center; font-style:italic; font-size:12px; }
  footer { padding:8px 12px; border-top:1px solid var(--border); display:flex; gap:6px; background:#0e0f13; }
  footer input { flex:1; font-family: ui-monospace,Menlo,Consolas,monospace; }
  #metrics { padding:0 12px; font-size:11px; color:var(--mute); border-top:1px solid var(--border); padding:8px 12px; line-height:1.7; }
  #metrics b { color:var(--fg); font-weight:500; }
  /* Narrow screens: header wraps, the side panel goes under the console. */
  @media (max-width: 760px) {
    body { height:auto; min-height:100vh; overflow:auto; }
    header { flex-wrap:wrap; gap:8px 10px; }
    header .right { margin-left:0; width:100%; flex-wrap:wrap; }
    header .right input { flex:1; min-width:0; }
    main { grid-template-columns: 1fr; }
    #console { height:55vh; }
    aside { border-left:0; border-top:1px solid var(--border); min-height:320px; }
    footer { position:sticky; bottom:0; }
  }
</style>
</head>
<body>
<header>
  <svg class="brand" viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="248" fill="#1D5FD8"/><circle cx="256" cy="256" r="228" fill="#2A75FA"/><path fill="none" stroke="#fff" stroke-width="74" stroke-linecap="round" stroke-linejoin="round" d="M136 150l132 106-132 106"/><rect x="338" y="160" width="84" height="192" rx="12" fill="#fff"/></svg>
  <h1>SboxServerConsole</h1>
  <span id="pill-child" class="pill">server: ?</span>
  <span id="pill-uptime" class="pill">uptime: ?</span>
  <span id="pill-stream" class="pill">stream: idle</span>
  <div class="right">
    <span id="auth-msg" role="alert"></span>
    <input type="password" id="pwd" placeholder="rcon-password" autocomplete="current-password">
    <button id="connect">Connect</button>
  </div>
</header>
<main>
  <section id="console" aria-live="polite"></section>
  <aside>
    <div class="tabs">
      <button data-tab="players" class="active">Players</button>
      <button data-tab="bans">Bans</button>
      <button data-tab="allows">Allowlist</button>
      <button data-tab="scheduler">Scheduler</button>
    </div>
    <div class="panel active" id="tab-players">
      <div id="players-list"></div>
    </div>
    <div class="panel" id="tab-bans">
      <div id="bans-list"></div>
      <form class="add" id="ban-add">
        <input name="steamid" placeholder="SteamID64 (17 digits)" required>
        <input name="reason" placeholder="reason (optional)">
        <button type="submit">Add ban</button>
      </form>
    </div>
    <div class="panel" id="tab-allows">
      <div id="allows-state" class="meta" style="padding:8px 0 4px;"></div>
      <div id="allows-list"></div>
      <form class="add" id="allow-add">
        <input name="steamid" placeholder="SteamID64 (17 digits)" required>
        <input name="note" placeholder="note (optional)">
        <button type="submit">Allow</button>
      </form>
    </div>
    <div class="panel" id="tab-scheduler">
      <div id="scheduler-list"></div>
      <form class="add" id="sched-add">
        <input name="id" placeholder="job id (optional)">
        <input name="schedule" placeholder='schedule  (e.g. "@every 30m"  or  "0 */4 * * *")' required>
        <input name="command" placeholder="command (sent verbatim)" required>
        <button type="submit">Add job</button>
      </form>
    </div>
    <div id="metrics"></div>
  </aside>
</main>
<footer>
  <input id="cmd" placeholder='type a command, press Enter (for example "status")' autocomplete="off">
  <button id="send">Send</button>
</footer>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const consoleEl = $("#console");
  const pwdEl = $("#pwd");
  const pillChild = $("#pill-child");
  const pillUptime = $("#pill-uptime");
  const pillStream = $("#pill-stream");
  const cmdEl = $("#cmd");
  const sendBtn = $("#send");
  const metricsEl = $("#metrics");
  const authMsg = $("#auth-msg");
  // The password is kept for this tab only after the agent accepted it, so a typo is
  // never stored and replayed on reload.
  let pwd = sessionStorage.getItem("ssc_pwd") || "";
  if (pwd) pwdEl.value = pwd;
  let connected = false;
  let streamAbort = null;
  let lastSeq = null;

  // A 401 or 429 ends the session: polling with a wrong password would only keep the
  // agent's lockout running (10 wrong tries in a minute lock the address for 5 minutes).
  class AuthError extends Error {}
  function checkAuth(r) {
    if (r.status === 401) { disconnect("Wrong password."); throw new AuthError("wrong password"); }
    if (r.status === 429) { disconnect("Too many wrong passwords from this address. Wait a few minutes, then connect again."); throw new AuthError("locked out"); }
  }
  function disconnect(message) {
    connected = false;
    if (streamAbort) { try { streamAbort.abort(); } catch {} streamAbort = null; }
    sessionStorage.removeItem("ssc_pwd");
    authMsg.textContent = message || "";
    pillStream.textContent = "stream: idle";
    pillStream.classList.remove("ok", "bad");
    pillChild.textContent = "server: ?";
    pillChild.classList.remove("ok", "bad");
  }

  function authHeaders() { return pwd ? { "X-RCON-Password": pwd } : {}; }
  async function getJson(p) {
    const r = await fetch(p, { headers: authHeaders() });
    checkAuth(r);
    if (!r.ok) throw new Error(`${p}: ${r.status}`);
    return r.json();
  }
  async function postJson(p, body) {
    const r = await fetch(p, {
      method: "POST",
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    checkAuth(r);
    return { ok: r.ok, status: r.status, body: await r.json().catch(() => ({})) };
  }
  async function delJson(p) {
    const r = await fetch(p, { method: "DELETE", headers: authHeaders() });
    checkAuth(r);
    return { ok: r.ok, status: r.status };
  }

  function appendLine(stream, text, seq) {
    const div = document.createElement("div");
    div.className = "ln " + stream;
    div.textContent = text;
    if (seq != null) div.dataset.seq = seq;
    const atBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 50;
    consoleEl.appendChild(div);
    while (consoleEl.children.length > 2000) consoleEl.removeChild(consoleEl.firstChild);
    if (atBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  async function loadHistory() {
    consoleEl.textContent = "";
    const h = await getJson("/history?count=300");
    for (const e of h.entries) { appendLine(e.stream, e.line, e.seq); lastSeq = e.seq; }
  }
  // The live console is read with fetch so the password goes in a header, never in
  // the address (addresses end up in proxy logs and browser history). It reconnects
  // by itself and resumes after the last line it showed.
  async function openStream() {
    if (streamAbort) try { streamAbort.abort(); } catch {}
    const ctl = new AbortController();
    streamAbort = ctl;
    let delay = 1000;
    while (connected && streamAbort === ctl) {
      pillStream.textContent = "stream: connecting";
      pillStream.classList.remove("ok", "bad");
      try {
        const headers = { ...authHeaders(), "Accept": "text/event-stream" };
        if (lastSeq != null) headers["Last-Event-ID"] = String(lastSeq);
        const r = await fetch("/stream", { headers, signal: ctl.signal, cache: "no-store" });
        checkAuth(r);
        if (!r.ok || !r.body) throw new Error(`stream: ${r.status}`);
        pillStream.textContent = "stream: live";
        pillStream.classList.add("ok");
        delay = 1000;
        const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          let cut;
          while ((cut = buf.indexOf("\n\n")) >= 0) {
            const block = buf.slice(0, cut);
            buf = buf.slice(cut + 2);
            for (const line of block.split("\n")) {
              if (!line.startsWith("data:")) continue;
              try {
                const d = JSON.parse(line.slice(5).trim());
                appendLine(d.stream, d.line, d.seq);
                lastSeq = d.seq;
              } catch {}
            }
          }
        }
      } catch (e) {
        if (e instanceof AuthError || ctl.signal.aborted) return;
      }
      if (!connected || streamAbort !== ctl) return;
      pillStream.textContent = "stream: down, retrying";
      pillStream.classList.remove("ok"); pillStream.classList.add("bad");
      await new Promise(res => setTimeout(res, delay));
      delay = Math.min(delay * 2, 15000);
    }
  }
  async function refreshHealth() {
    try {
      const h = await getJson("/status");
      pillChild.textContent = h.child_alive ? `server: running (pid ${h.child_pid})` : "server: stopped";
      pillChild.classList.toggle("ok", !!h.child_alive);
      pillChild.classList.toggle("bad", !h.child_alive);
      pillUptime.textContent = h.child_alive ? `uptime: ${formatUptime(h.child_uptime_sec)}` : "uptime: -";
      renderMetrics(h);
    } catch (e) {
      if (e instanceof AuthError) return;
      pillChild.textContent = "server: ?";
      pillChild.classList.remove("ok"); pillChild.classList.add("bad");
    }
  }
  function formatUptime(s) {
    if (!(s >= 0)) return "-";
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s/60)}m`;
    if (s < 86400) return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
    return `${Math.floor(s/86400)}d ${Math.floor((s%86400)/3600)}h`;
  }
  async function refreshPlayers() {
    const list = $("#players-list");
    try {
      const data = await getJson("/players");
      if (!data.players?.length) {
        // The A2S roster carries names but no SteamIDs, so it gets no kick/ban buttons.
        const a2s = data.a2s_players || [];
        if (!a2s.length) { list.innerHTML = '<div class="empty">no players online</div>'; return; }
        list.innerHTML = "";
        for (const p of a2s) {
          const row = document.createElement("div"); row.className = "row";
          row.innerHTML = `<div class="name">${escapeHtml(p.name || "(unnamed)")}<div class="meta">from A2S, no SteamID · ${formatUptime(Math.round(p.duration_sec || 0))}</div></div>`;
          list.appendChild(row);
        }
        return;
      }
      list.innerHTML = "";
      for (const p of data.players) {
        const row = document.createElement("div"); row.className = "row";
        row.innerHTML = `<div class="name">${escapeHtml(p.name || "(unnamed)")}<div class="meta">${escapeHtml(p.steamid)}</div></div>
                         <button class="ghost" data-kick="${escapeHtml(p.steamid)}">kick</button>
                         <button class="del" data-ban="${escapeHtml(p.steamid)}">ban</button>`;
        list.appendChild(row);
      }
    } catch (e) { if (!(e instanceof AuthError)) list.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`; }
  }
  async function refreshBans() {
    const list = $("#bans-list");
    try {
      const data = await getJson("/bans");
      if (!data.bans?.length) { list.innerHTML = '<div class="empty">no bans</div>'; return; }
      list.innerHTML = "";
      for (const b of data.bans) {
        const row = document.createElement("div"); row.className = "row";
        row.innerHTML = `<div class="name">${escapeHtml(b.steamid)}<div class="meta">${escapeHtml(b.reason || "(no reason)")} · ${escapeHtml(b.added_at?.slice(0,19) || "")}</div></div>
                         <button class="del" data-unban="${escapeHtml(b.steamid)}">unban</button>`;
        list.appendChild(row);
      }
    } catch (e) { if (!(e instanceof AuthError)) list.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`; }
  }
  async function refreshAllows() {
    const list = $("#allows-list");
    const state = $("#allows-state");
    try {
      const data = await getJson("/allows");
      state.textContent = data.enforced
        ? "Enforced: anyone not listed is kicked when they join."
        : "Empty: the server is open to everyone. Add a SteamID to start enforcing.";
      if (!data.allow?.length) { list.innerHTML = ""; return; }
      list.innerHTML = "";
      for (const a of data.allow) {
        const row = document.createElement("div"); row.className = "row";
        row.innerHTML = `<div class="name">${escapeHtml(a.steamid)}<div class="meta">${escapeHtml(a.note || "(no note)")} · ${escapeHtml(a.added_at?.slice(0,19) || "")}</div></div>
                         <button class="del" data-unallow="${escapeHtml(a.steamid)}">remove</button>`;
        list.appendChild(row);
      }
    } catch (e) { if (!(e instanceof AuthError)) list.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`; }
  }
  async function refreshScheduler() {
    const list = $("#scheduler-list");
    try {
      const data = await getJson("/scheduler");
      if (!data.jobs?.length) { list.innerHTML = '<div class="empty">no scheduled jobs</div>'; return; }
      list.innerHTML = "";
      for (const j of data.jobs) {
        const row = document.createElement("div"); row.className = "row";
        const next = j.next_fire_at ? new Date(j.next_fire_at).toLocaleString() : "never";
        row.innerHTML = `<div class="name">${escapeHtml(j.id)}<div class="meta">${escapeHtml(j.schedule)} → ${escapeHtml(j.command)}<br>next: ${escapeHtml(next)} · runs: ${j.run_count}</div></div>
                         <button class="ghost" data-toggle="${escapeHtml(j.id)}" data-state="${j.enabled}">${j.enabled ? "disable" : "enable"}</button>
                         <button class="del" data-deljob="${escapeHtml(j.id)}">del</button>`;
        list.appendChild(row);
      }
    } catch (e) { if (!(e instanceof AuthError)) list.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`; }
  }
  function renderMetrics(h) {
    const mb = (h.child_memory_bytes || 0) / 1048576;
    const srv = h.server;
    metricsEl.innerHTML = `
      <div><b>server</b> ${srv ? `${escapeHtml(srv.name)} · ${srv.players}/${h.player_limit > 0 ? h.player_limit : srv.max_players} players${srv.map ? " · " + escapeHtml(srv.map) : ""}` : "no A2S answer yet"}</div>
      <div><b>process</b> ${h.child_alive ? `${mb.toFixed(0)} MB · ${escapeHtml(String(h.child_cpu_seconds))} CPU s` : "stopped"}</div>
      <div><b>agent</b> up ${formatUptime(h.sidecar_uptime_sec)} · ${h.execute_total} commands · ${h.stream_clients_active} live viewer(s)</div>
    `;
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

  document.querySelectorAll(".tabs button").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      $("#tab-" + b.dataset.tab).classList.add("active");
    });
  });

  async function refreshAll() {
    await refreshHealth();
    if (!connected) return;
    await Promise.all([refreshPlayers(), refreshBans(), refreshAllows(), refreshScheduler()]);
  }

  async function connect() {
    disconnect("");
    pwd = pwdEl.value;
    authMsg.textContent = "";
    // One check first: a wrong password costs one try, not a burst of them.
    let r;
    try { r = await fetch("/status", { headers: authHeaders() }); }
    catch (e) { authMsg.textContent = "Cannot reach the agent."; return; }
    try { checkAuth(r); } catch { return; }
    if (!r.ok) { authMsg.textContent = `Agent answered ${r.status}.`; return; }
    sessionStorage.setItem("ssc_pwd", pwd);
    connected = true;
    lastSeq = null;
    try { await loadHistory(); } catch (e) { if (e instanceof AuthError) return; appendLine("system", `history error: ${e.message}`); }
    openStream();
    await refreshAll();
  }
  $("#connect").addEventListener("click", connect);
  pwdEl.addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });

  async function send() {
    const c = cmdEl.value.trim();
    if (!c || !connected) return;
    cmdEl.value = "";
    sendBtn.disabled = true;
    try {
      const r = await postJson("/execute?collect=1", { cmd: c });
      if (!r.ok) appendLine("system", `command not sent: ${r.body.error || r.status}`);
    } catch (e) { if (!(e instanceof AuthError)) appendLine("system", `command not sent: ${e.message}`); }
    finally { sendBtn.disabled = false; }
  }
  sendBtn.addEventListener("click", send);
  cmdEl.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

  document.body.addEventListener("click", async (e) => {
    const t = e.target;
    if (!connected || !t.dataset) return;
    try { await onListClick(t); } catch (err) { if (!(err instanceof AuthError)) appendLine("system", err.message); }
  });
  async function onListClick(t) {
    if (t.dataset.kick) {
      await postJson("/execute", { cmd: `kick ${t.dataset.kick}` });
    } else if (t.dataset.ban) {
      const reason = prompt(`reason for banning ${t.dataset.ban}?`, "") || "";
      const r = await postJson("/bans", { steamid: t.dataset.ban, reason });
      if (r.ok) { await refreshBans(); await refreshPlayers(); }
      else alert("ban failed: " + (r.body.error || r.status));
    } else if (t.dataset.unban) {
      const r = await delJson(`/bans/${encodeURIComponent(t.dataset.unban)}`);
      if (r.ok) await refreshBans();
    } else if (t.dataset.unallow) {
      const r = await delJson(`/allows/${encodeURIComponent(t.dataset.unallow)}`);
      if (r.ok) await refreshAllows();
    } else if (t.dataset.toggle) {
      const on = t.dataset.state === "true";
      await postJson(`/scheduler/${encodeURIComponent(t.dataset.toggle)}/${on ? "disable" : "enable"}`, {});
      await refreshScheduler();
    } else if (t.dataset.deljob) {
      const r = await delJson(`/scheduler/${encodeURIComponent(t.dataset.deljob)}`);
      if (r.ok) await refreshScheduler();
    }
  }

  // Each add form: posts its fields, reloads its list, says why when the agent refused.
  function onSubmit(id, post) {
    document.getElementById(id).addEventListener("submit", (e) => {
      e.preventDefault();
      if (!connected) return;
      post(e.target).catch(err => { if (!(err instanceof AuthError)) appendLine("system", err.message); });
    });
  }
  onSubmit("ban-add", async (f) => {
    const r = await postJson("/bans", { steamid: f.steamid.value.trim(), reason: f.reason.value });
    if (r.ok) { f.reset(); await refreshBans(); }
    else alert("ban failed: " + (r.body.error || r.status));
  });
  onSubmit("allow-add", async (f) => {
    const r = await postJson("/allows", { steamid: f.steamid.value.trim(), note: f.note.value });
    if (r.ok) { f.reset(); await refreshAllows(); }
    else alert("allowlist add failed: " + (r.body.error || r.status));
  });
  onSubmit("sched-add", async (f) => {
    const r = await postJson("/scheduler", { id: f.id.value, schedule: f.schedule.value, command: f.command.value });
    if (r.ok) { f.reset(); await refreshScheduler(); }
    else alert("scheduler add failed: " + (r.body.error || r.status));
  });

  // Lists refresh every 5 seconds while connected, and not at all while the tab is hidden.
  setInterval(() => { if (connected && !document.hidden) refreshAll(); }, 5000);

  if (pwd) $("#connect").click();
})();
</script>
</body>
</html>
