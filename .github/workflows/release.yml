name: Release

# Triggered by pushing a version tag (v1.0.1, v1.1.0, etc.).
# Master commits alone do not build a release — only tagged versions do.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Build both win-x64 and linux-x64 from a single Linux runner. .NET's
    # cross-target publish handles the win-x64 single-file binary cleanly
    # without needing a Windows runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish win-x64 single-file binary
        run: |
          dotnet publish src/SboxServerConsole.csproj \
            -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -o publish/win-x64

      - name: Publish linux-x64 single-file binary
        run: |
          dotnet publish src/SboxServerConsole.csproj \
            -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -o publish/linux-x64
          chmod +x publish/linux-x64/SboxServerConsole

      - name: Stage release archives
        run: |
          set -euo pipefail
          mkdir -p stage

          # Windows zip: SboxServerConsole.exe + README/LICENSE + service installer scripts
          cp publish/win-x64/SboxServerConsole.exe stage/
          cp README.md LICENSE stage/
          cp -r scripts stage/scripts
          cp -r examples stage/examples
          (cd stage && zip -r ../SboxServerConsole-win-x64.zip .)
          rm -rf stage/* stage/.[!.]* 2>/dev/null || true

          # Linux tar.gz: SboxServerConsole + README/LICENSE + systemd unit example
          cp publish/linux-x64/SboxServerConsole stage/
          chmod +x stage/SboxServerConsole
          cp README.md LICENSE stage/
          cp -r examples stage/examples
          tar -czf SboxServerConsole-linux-x64.tar.gz -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: SboxServerConsole
          path: |
            publish/win-x64/SboxServerConsole.exe
            publish/linux-x64/SboxServerConsole
            SboxServerConsole-win-x64.zip
            SboxServerConsole-linux-x64.tar.gz

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          awk -v t="$tag" '
            /^## \[/ {
              if (capture) exit
              if ($0 ~ "^## \\[" t "\\]") { capture = 1; next }
            }
            capture { print }
          ' CHANGELOG.md > release_section.md

          if [ ! -s release_section.md ]; then
            echo "No CHANGELOG section found for v$tag" >&2
            exit 1
          fi

          utm_tag="${tag//./_}"
          {
            echo "## What's in this release"
            echo
            cat release_section.md
            echo
            echo "## Download"
            echo
            echo "- Windows (x64): \`SboxServerConsole.exe\` (single file) or \`SboxServerConsole-win-x64.zip\` (binary + scripts + examples)"
            echo "- Linux (x64): \`SboxServerConsole-linux-x64.tar.gz\` (binary + examples + systemd unit)"
            echo
            echo "## Install / Upgrade"
            echo
            echo "Drop the binary next to your s&box dedicated server install and launch it as documented in the [README](https://github.com/HumanGenome/SboxServerConsole#installation). Reinstalling is safe — bans, scheduler jobs, and audit logs persist across restarts."
            echo
            echo "## Official Hosting"
            echo
            echo "Don't want to run your own server? [SurvivalServers.com](https://www.survivalservers.com/services/game_servers/sbox/?utm_source=github&utm_medium=release&utm_campaign=sbox_console_v$utm_tag) offers s&box dedicated servers with SboxServerConsole pre-installed and panel-integrated."
          } > release_notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/win-x64/SboxServerConsole.exe
            publish/linux-x64/SboxServerConsole
            SboxServerConsole-win-x64.zip
            SboxServerConsole-linux-x64.tar.gz
          body_path: release_notes.md
