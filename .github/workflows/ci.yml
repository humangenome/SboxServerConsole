name: CI

# Build check on every push and PR. Tagged releases are handled by release.yml.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the unreleased-code check finds the last release tag with git describe,
      # which a one-commit checkout cannot see.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build (warnings are errors)
        run: dotnet build src/SboxServerConsole.csproj -c Release -warnaserror

      - name: Test
        timeout-minutes: 20
        run: |
          dotnet test tests/SboxServerConsole.Tests/SboxServerConsole.Tests.csproj \
            --settings tests/SboxServerConsole.Tests/test.runsettings \
            -warnaserror

      - name: Changelog has a section for the current version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' src/SboxServerConsole.csproj)"
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "csproj <Version> is $version but CHANGELOG.md has no '## [$version]' section." >&2
            exit 1
          fi
          echo "CHANGELOG has a section for $version"

      # Fails only on main, and only once shipped code has waited 24 hours for a release.
      # A branch is unreleased by definition, so there it reports.
      - name: Shipped code has a release carrying it
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tools/ci/check-unreleased.sh
          else
            tools/ci/check-unreleased.sh --report
          fi

      - name: Publish both targets
        run: |
          set -euo pipefail
          dotnet publish src/SboxServerConsole.csproj -c Release -r win-x64 \
            --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/win-x64
          dotnet publish src/SboxServerConsole.csproj -c Release -r linux-x64 \
            --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/linux-x64

      # Everything built into the binaries has its licence and notices in THIRD-PARTY-NOTICES.txt.
      - name: Third-party notices cover what is built in
        run: >-
          python3 scripts/check-notices.py
          --deps src/bin/Release/net10.0/win-x64/SboxServerConsole.deps.json
          --deps src/bin/Release/net10.0/linux-x64/SboxServerConsole.deps.json

      # A Windows exe marked CET-compatible refuses to start on some Windows builds. Directory.Build.props
      # turns the flag off; this reads it from the published exe.
      - name: The Windows exe is not marked CET-compatible
        run: python3 scripts/check-cet-compat.py publish/win-x64/SboxServerConsole.exe

      - name: Leak gate on shipped binaries
        shell: bash
        env:
          LEAK_GATE_WORDS: ${{ secrets.LEAK_GATE_WORDS }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          # Log literals and embedded resources land in the binary's string table.
          # Nothing about a private deployment, a host address, or a hosting panel
          # may ship inside a public artifact.
          # A host address with a port is never allowed. Deployment-specific words come from the
          # LEAK_GATE_WORDS repository secret (one regex alternation), so this public file names none.
          pattern='[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:[0-9]{4,5}'
          if [ -n "${LEAK_GATE_WORDS:-}" ]; then
            pattern="$pattern|$LEAK_GATE_WORDS"
          elif [ "${IS_FORK_PR:-false}" = "true" ]; then
            echo "::notice::LEAK_GATE_WORDS is not available to pull requests from forks; checking addresses only"
          else
            echo "::error::the LEAK_GATE_WORDS repository secret is missing"
            exit 1
          fi
          fail=0
          for f in publish/win-x64/SboxServerConsole.exe publish/linux-x64/SboxServerConsole; do
            echo "--- $f"
            # Both encodings: .NET string tables store UTF-16, which an
            # ASCII-only strings pass reports as clean.
            for enc in s l; do
              if strings -a -e "$enc" "$f" | grep -inE "$pattern"; then
                echo "::error file=$f::leak gate matched in $f (strings -e $enc)"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] && echo "leak gate clean"
          exit "$fail"

  windows-throttle-tests:
    # The unit tests above run on Linux. The wrong-password limit is the one piece of
    # them with no platform code at all; it runs on Windows too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Wrong-password limit tests
        timeout-minutes: 10
        run: dotnet test tests/SboxServerConsole.Tests/SboxServerConsole.Tests.csproj --filter "FullyQualifiedName~Throttle" -warnaserror

  windows-smoke:
    # The unit tests run on Linux. This runs the published exe on Windows, with
    # cmd.exe standing in for the server, to cover ConPTY, the job object, HTTP.sys
    # and the Windows service path.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish win-x64
        run: dotnet publish src/SboxServerConsole.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish/win-x64

      - name: Smoke test (console and service)
        timeout-minutes: 10
        shell: pwsh
        run: ./tests/windows-smoke.ps1 -Exe publish/win-x64/SboxServerConsole.exe
